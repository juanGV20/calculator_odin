<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator odin</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="main-calculator">
        <header class="calculator-header">
            <div>Odin Calculator</div>
        </header>
        <section class="calculator-section-results">
            <div class="operation"></div>
            <h1 class="result">1,248.50</h1>
        </section>
        <section class="calculator-section-keypad">
            <div class="calculator-section-keypad-column">
                <button class="buttons-special calculator-button">AC</button>
                <button class="calculator-button">7</button>
                <button class="calculator-button">4</button>
                <button class="calculator-button">1</button>
                <button class="calculator-button">0</button>
            </div>
            <div class="calculator-section-keypad-column">
                <button class="calculator-button buttons-special">±</button>
                <button class="calculator-button">8</button>
                <button class="calculator-button">5</button>
                <button class="calculator-button">2</button>
            </div>
            <div class="calculator-section-keypad-column">
                <button class="calculator-button buttons-special">%</button>
                <button class="calculator-button">9</button>
                <button class="calculator-button">6</button>
                <button class="calculator-button">3</button>
                <button class="calculator-button">.</button>
            </div>
            <div class="calculator-section-keypad-column">
                <button class="calculator-button buttons-operations">÷</button>
                <button class="calculator-button buttons-operations">x</button>
                <button class="calculator-button buttons-operations">-</button>
                <button class="calculator-button buttons-operations">+</button>
                <button class="calculator-button button-equal">=</button>
            </div>
        </section>
    </main>
</body>
<script src="app.js"></script>
</html>
